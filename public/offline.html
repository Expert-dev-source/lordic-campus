<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Offline · Lordic Campus</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(100%, 34rem); padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
      h1 { margin-top: 0; font-size: 1.6rem; }
      p { color: #d1d5db; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; border-radius: .6rem; background: #d1aa3a; color: #111827; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>This page has not been saved on this device yet. Reconnect and visit it once to make it available offline.</p>
      <p>Pages you have already opened may still be available from the app navigation.</p>
      <a href="/">Go to Lordic Campus</a>
    </main>
  </body>
</html>
